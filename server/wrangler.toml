name = "citadel-defense-leaderboard"
main = "worker.js"
compatibility_date = "2026-01-01"

# Create the namespace once:  npx wrangler kv namespace create BOARD
# then paste the id it prints below.
[[kv_namespaces]]
binding = "BOARD"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Deploy:  npx wrangler deploy
# Then set Config.LEADERBOARD_URL in the game to the printed workers.dev URL
# and Config.CLAIM_URL to "<that url>/claim/".
